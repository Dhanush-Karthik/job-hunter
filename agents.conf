# agents.conf — role -> model config for on-demand sub-agents. Sourced by scripts/agent.sh.
# Edit values only. Add a role: define ROLE_<name>_{KIND,MODEL,EFFORT}, then add <name> to ROLES.
#
# KIND    : claude | codex                      (any herdr kind works for start; model/effort flags below only
#                                                 implemented for claude and codex)
# MODEL   : claude -> opus | sonnet | haiku | full id (e.g. claude-opus-5-5, claude-sonnet-5-5,
#                    claude-haiku-4-5-20251001)
#           codex  -> gpt-6.1-sol | any model your codex account lists | "" = codex default (~/.codex/config.toml)
# EFFORT  : claude -> low | medium | high | xhigh | max
#           codex  -> minimal | low | medium | high | xhigh   (model_reasoning_effort)
#           ""     -> tool default
#
# No reviewer role by design.

# --- lead: the persistent planner, started by scripts/up.sh (same option values as roles above) --
LEAD_KIND=claude
LEAD_MODEL=opus
LEAD_EFFORT=high
WORKSPACE_LABEL=job-hunter  # herdr workspace name up.sh creates / reuses

ROLES="builder builder2 codex_builder tester"

# --- builder: main implementation worker -------------------------------------------------------
ROLE_builder_KIND=claude
ROLE_builder_MODEL=sonnet
ROLE_builder_EFFORT=high

# --- builder2: second parallel implementation worker (disjoint files from builder) ------------
ROLE_builder2_KIND=claude
ROLE_builder2_MODEL=sonnet
ROLE_builder2_EFFORT=high

# --- codex_builder: self-contained modules, scrapers, scripts ----------------------------------
ROLE_codex_builder_KIND=codex
ROLE_codex_builder_MODEL=gpt-6.1-sol
ROLE_codex_builder_EFFORT=high

# --- tester: writes + runs tests, reports failures. Swap to claude/sonnet/medium if preferred ---
#   claude option: KIND=claude MODEL=sonnet EFFORT=medium
ROLE_tester_KIND=codex
ROLE_tester_MODEL=gpt-6.1-sol
ROLE_tester_EFFORT=medium

# --- spawn behaviour ---------------------------------------------------------------------------
SPLIT_DIRECTION=down        # right | down  (where a new agent pane appears relative to the lead pane)
STARTUP_TIMEOUT_MS=60000    # herdr agent start timeout
