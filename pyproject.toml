[project]
name = "jobhunter"
version = "0.1.0"
description = "Hunts jobs: sourcing, matching, tailoring, outreach, tracking."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "apscheduler>=3.10,<4",
    "pyyaml>=6",
    "httpx>=0.27",
    "python-jobspy>=1.1.80",
    "imap-tools>=1.7",
    "keyring>=25",
    "selectolax>=0.3",
    "rapidfuzz>=3.10",
    "sse-starlette>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "schemathesis>=3.36",
    "ruff>=0.7",
]

[project.scripts]
jobhunter = "jobhunter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobhunter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
extend-ignore = ["B008", "UP046"]  # FastAPI Query() defaults; pydantic Generic keeps contract schema names
